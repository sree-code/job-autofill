<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Autofill – Profile</title>
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 760px; margin: 32px auto; padding: 0 16px; font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 22px; } h2 { font-size: 15px; margin-top: 28px; border-bottom: 1px solid #8884; padding-bottom: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 14px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; }
    input, select { padding: 7px 8px; font: inherit; border: 1px solid #8886; border-radius: 6px; }
    #save { margin-top: 24px; padding: 10px 20px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    #status { margin-left: 12px; color: #16a34a; }
    .note { color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Job Autofill profile</h1>
  <p class="note">Stored only in this browser (chrome.storage.local). Nothing is sent anywhere.</p>
  <form id="f"></form>
  <h2>Files</h2>
  <div class="grid">
    <label>Resume (PDF/DOCX) <input type="file" id="resume" accept=".pdf,.doc,.docx"><span class="note" id="resumeName"></span></label>
    <label>Cover letter <input type="file" id="coverLetter" accept=".pdf,.doc,.docx"><span class="note" id="coverLetterName"></span></label>
  </div>
  <h2>Behaviour &amp; AI</h2>
  <div class="grid" id="settings">
    <label>Auto-fill when a form appears <select name="autoFill"><option value="true">On</option><option value="false">Off</option></select></label>
    <label>AI answers for unknown questions <select name="aiEnabled"><option value="true">On</option><option value="false">Off</option></select></label>
    <label>Anthropic API key <input name="apiKey" type="password" autocomplete="off" placeholder="sk-ant-…"></label>
    <label>Model <input name="model" placeholder="claude-sonnet-5-5"></label>
    <label>Session context limit (tokens) <input name="contextLimit" type="number" placeholder="120000"></label>
    <label>API base URL (advanced) <input name="baseURL" placeholder="https://api.anthropic.com"></label>
  </div>
  <p class="note">The key is stored only in this browser and sent only to the Anthropic API. When a session reaches the context limit it is summarized into memory and a new session starts.</p>
  <p class="note" id="aiStatus"></p>
  <button type="button" id="resetAI">New AI session (keep memory)</button>
  <button type="button" id="wipeAI">Clear AI memory</button>
  <br>
  <button id="save">Save</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
