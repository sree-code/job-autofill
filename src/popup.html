<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 280px; padding: 14px; }
    header { display: flex; align-items: center; gap: 10px; margin: 0 2px 14px; }
    header img { width: 28px; height: 28px; }
    header strong { font-size: 15px; letter-spacing: -.01em; }
    .btn { width: 100%; height: 38px; font-size: 14px; }
    .btn + .btn { margin-top: 8px; }
    #out:empty { display: none; }
    #out { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg-2); font-size: 13px; line-height: 1.45; }
    #out b { display: block; font-size: 14px; margin-bottom: 2px; }
    #out span { color: var(--label-2); }
  </style>
</head>
<body>
  <header><img src="../icons/icon32.png" alt=""><strong>Appliqué</strong></header>
  <button id="fill" class="btn primary">Fill this page</button>
  <button id="opts" class="btn">Edit profile</button>
  <div id="out" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
